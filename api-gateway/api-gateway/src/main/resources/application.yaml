server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:lb://auth-service}
              predicates:
                - Path=/auth/**

            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URI:lb://inventory-service}
              predicates:
                - Path=/inventory/**

            - id: order-service
              uri: ${ORDER_SERVICE_URI:lb://order-service}
              predicates:
                - Path=/orders/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:lb://payment-service}
              predicates:
                - Path=/payments/**


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    register-with-eureka: ${EUREKA_REGISTER:true}
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost

jwt:
  secret: 1234567890123456789012345678901234567890