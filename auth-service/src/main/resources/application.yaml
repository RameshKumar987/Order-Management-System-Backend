server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: auth-service

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.oauth2.server.servlet.OAuth2AuthorizationServerAutoConfiguration

  datasource:
    url: jdbc:mysql://localhost:3306/oms_auth
    username: root
    password: rkRK@9877895

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # Email Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com  # Replace with your email
    password: your-app-password      # Replace with your app password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: 1234567890123456789012345678901234567890
  expiration: 900 # 15 minutes (access token) in seconds
  refresh-token-expiration: 604800 # 7 days in seconds

# OAuth 2.0 Configuration
oauth2:
  # Token expiration settings
  access-token-validity: 900 # 15 minutes
  refresh-token-validity: 604800 # 7 days

  # Scope configuration
  scopes:
    admin: "admin:read admin:write inventory:read inventory:write user:read user:write"
    inventory: "inventory:read inventory:write"
    customer: "order:read order:write user:read"

logging:
  level:
    root: INFO
    com.oms.auth_service: DEBUG

# OTP Configuration
app:
  otp:
    validity-minutes: 5      # OTP validity in minutes
    max-attempts: 5          # Maximum wrong attempts allowed

