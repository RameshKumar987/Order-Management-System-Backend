server:
  port: 8082

spring:
  application:
    name: inventory-service
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/oms_inventory}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rkRK@9877895}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    consumer:
      group-id: inventory-group-v3
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # Security handled by API Gateway - no oauth2ResourceServer needed here

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    register-with-eureka: ${EUREKA_REGISTER:true}
  instance:
    prefer-ip-address: true

# JWT Token Configuration
jwt:
  secret: 1234567890123456789012345678901234567890
  expiration: 900 # 15 minutes

logging:
  level:
    root: INFO
    com.inventory_service: DEBUG